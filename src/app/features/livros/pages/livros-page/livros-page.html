<div class="livros-page">
  <h1>Sistema de Cadastro de Livros</h1>
  
  @if (erro()) {
    <div class="erro">{{ erro() }}</div>
  }

  <div class="actions">
    <button (click)="onNovoLivro()" class="btn-novo">Novo Livro</button>
  </div>

  <app-filtro-livros 
    (search)="onSearch($event)" 
    (filterByCategoria)="onFilterByCategoria($event)">
  </app-filtro-livros>

  <app-lista-livros [livros]="livrosFiltrados()"></app-lista-livros>
</div>
