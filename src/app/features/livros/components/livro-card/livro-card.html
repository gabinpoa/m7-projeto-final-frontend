<div class="livro-card">
  <div class="card-header">
    <h3>{{ livro.titulo }}</h3>
    @if (livro.googleBooksId) {
      <span class="google-books-badge">Google Books</span>
    }
  </div>
  <p class="autor-field"><strong>Autor:</strong> {{ livro.autor }}</p>
  <p><strong>Categoria:</strong> {{ livro.categoria }}</p>
  <p><strong>Ano:</strong> {{ livro.ano }}</p>
  <p><strong>Status:</strong> {{ livro.status }}</p>
  @if (livro.descricao) {
    <p class="descricao-field"><strong>Descrição:</strong> {{ livro.descricao }}</p>
  }
  <button class="card-button" [routerLink]="['/livros', livro._id]">Ver Detalhes</button>
</div>
