<div class="formulario-livro">
  <h2>Cadastrar Novo Livro</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="titulo">Título: *</label>
      <input 
        type="text" 
        id="titulo" 
        [value]="livro().titulo" 
        (input)="updateField('titulo', $any($event.target).value)"
        name="titulo"
        required
      >
    </div>

    <div class="form-group">
      <label for="autor">Autor: *</label>
      <input 
        type="text" 
        id="autor" 
        [value]="livro().autor" 
        (input)="updateField('autor', $any($event.target).value)"
        name="autor"
        required
      >
    </div>

    <div class="form-group">
      <label for="categoria">Categoria: *</label>
      <select 
        id="categoria" 
        [value]="livro().categoria" 
        (change)="updateField('categoria', $any($event.target).value)"
        name="categoria"
        required
      >
        <option value="">Selecione</option>
        <option value="Tecnologia">Tecnologia</option>
        <option value="Ficção">Ficção</option>
        <option value="Não-ficção">Não-ficção</option>
        <option value="Romance">Romance</option>
        <option value="História">História</option>
      </select>
    </div>

    <div class="form-group">
      <label for="ano">Ano: *</label>
      <input 
        type="number" 
        id="ano" 
        [value]="livro().ano" 
        (input)="updateField('ano', $any($event.target).value)"
        name="ano"
        required
        min="1000"
        max="2099"
      >
    </div>

    <div class="form-group">
      <label for="status">Status: *</label>
      <select 
        id="status" 
        [value]="livro().status" 
        (change)="updateField('status', $any($event.target).value)"
        name="status"
        required
      >
        <option value="disponivel">Disponível</option>
        <option value="emprestado">Emprestado</option>
        <option value="reservado">Reservado</option>
      </select>
    </div>

    <div class="form-group">
      <label for="descricao">Descrição:</label>
      <textarea 
        id="descricao" 
        [value]="livro().descricao" 
        (input)="updateField('descricao', $any($event.target).value)"
        name="descricao"
        rows="3"
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-salvar">Salvar</button>
      <button type="button" class="btn-cancelar" (click)="onCancel()">Cancelar</button>
    </div>
  </form>
</div>
